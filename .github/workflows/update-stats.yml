name: Atualizar Estatísticas do README

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Baixar estatísticas
        run: |
          curl -L -o stats.svg "https://github-readme-stats.ahmadawais.tech/api?username=Eduarda-Nere&show_icons=true&theme=dracula&include_all_commits=true&count_private=true"
          curl -L -o top-langs.svg "https://github-readme-stats.ahmadawais.tech/api/top-langs/?username=Eduarda-Nere&layout=compact&langs_count=7&theme=dracula"
          
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg top-langs.svg
          git commit -m "Atualizar stats" || echo "Sem mudanças"
          git push
