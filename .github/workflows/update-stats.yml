name: Atualizar Estatísticas do README

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Gerar novos cards de estatística
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install axios

      - name: Generate stats card
        run: |
          node -e "
          const axios = require('axios');
          const fs = require('fs');
          
          async function download(url, filename) {
            const response = await axios({
              method: 'get',
              url: url,
              responseType: 'stream'
            });
            response.data.pipe(fs.createWriteStream(filename));
            return new Promise((resolve, reject) => {
              response.data.on('end', () => resolve());
              response.data.on('error', (err) => reject(err));
            });
          }
          
          async function run() {
            await download('https://github-readme-stats.vercel.app/api?username=Eduarda-Nere&show_icons=true&theme=dracula&include_all_commits=true&count_private=true', 'stats.svg');
            await download('https://github-readme-stats.vercel.app/api/top-langs/?username=Eduarda-Nere&layout=compact&langs_count=7&theme=dracula', 'top-langs.svg');
            console.log('Download concluído!');
          }
          
          run().catch(console.error);
          "

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add stats.svg top-langs.svg 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update profile stats cards"
          git push
